name: Refresh LeetCode and Codeforces stats

on:
  schedule:
    - cron: '23 * * * *' # every hour; the site only redeploys when a number changed
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: fetch
        run: node scripts/fetch-stats.mjs
      - if: steps.fetch.outputs.changed == 'true'
        name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/stats.json
          git commit -m "Refresh LeetCode and Codeforces stats"
          git push
          gh workflow run deploy.yml --ref main
