<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Eshaan Singla</title>
<meta name="robots" content="noindex" />
<style>
  :root { --canvas: #F6F5F0; --ink: #151514; --mute: #6a675f; --rule: #dcd8cc; --signal: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --canvas: #121211; --ink: #ecebe6; --mute: #9a968d; --rule: #2c2b29; --signal: #ff6a2c; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--canvas); color: var(--ink); font-family: Newsreader, Georgia, "Times New Roman", serif; }
  main { max-width: 560px; width: 100%; }
  .k { font: 12px/1.4 ui-monospace, "JetBrains Mono", Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--signal); }
  h1 { font-weight: 400; font-size: clamp(36px, 8vw, 56px); line-height: 1.05; letter-spacing: -.02em; margin-top: 14px; }
  h1 i { color: var(--signal); }
  p { margin-top: 16px; font-size: 18px; line-height: 1.5; color: var(--mute); }
  svg { display: block; width: 100%; height: 56px; margin-top: 28px; border-top: 1px solid var(--rule); }
  a.b { display: inline-block; margin-top: 28px; padding: 12px 20px; border-radius: 999px; background: var(--ink); color: var(--canvas); text-decoration: none; font: 13px/1 ui-monospace, "JetBrains Mono", Menlo, monospace; }
  a.b:hover { background: var(--signal); }
</style>
</head>
<body>
<main>
  <div class="k">Fig. 404</div>
  <h1>This page is <i>not</i> in the paper.</h1>
  <p>The link may be mistyped, or the page has moved. Everything lives on the main page.</p>
  <svg viewBox="0 0 560 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 H190 L205 12 L222 52 L236 28 L246 40 H560" fill="none" stroke="var(--signal)" stroke-width="2" vector-effect="non-scaling-stroke" /></svg>
  <a class="b" href="/">Back to the paper</a>
</main>
</body>
</html>
